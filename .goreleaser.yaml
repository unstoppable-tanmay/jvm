version: 2

project_name: jvm

before:
  hooks:
    - go mod tidy

builds:
  - id: jvm
    main: ./cmd/jvm
    binary: jvm
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/unstoppable-tanmay/jvm/internal/cli.Version={{.Version}}

archives:
  - id: jvm-archive
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - jvm.sh
      - jvm.fish
      - jvm.ps1
      - jvm.cmd

nfpms:
  - id: jvm-packages
    package_name: jvm
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - jvm
    formats:
      - deb
      - rpm
      - apk
    vendor: "unstoppable-tanmay"
    homepage: "https://github.com/unstoppable-tanmay/jvm"
    maintainer: "Tanmay <https://github.com/unstoppable-tanmay>"
    description: "Java version management, made simple."
    license: "MIT"
    section: "devel"
    contents:
      - src: ./jvm.sh
        dst: /etc/profile.d/jvm.sh
        file_info:
          mode: 0644
      - src: ./jvm.fish
        dst: /usr/share/fish/vendor_conf.d/jvm.fish
        file_info:
          mode: 0644

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - 'Merge pull request'
