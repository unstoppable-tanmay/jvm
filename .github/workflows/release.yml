name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-calculate and push next version tag
        run: |
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "Current latest tag: $LATEST_TAG"

          CLEAN_VER="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VER"

          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          BUMP="${{ inputs.bump }}"
          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Next release tag: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install NSIS on macOS
        run: |
          brew install makensis

      - name: Run GoReleaser (Compiles binaries & Linux deb/rpm)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS Installer (jvm.dmg)
        run: |
          mkdir -p dist/dmg_root/bin

          # Compile macOS universal binaries directly
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w -X github.com/unstoppable-tanmay/jvm/internal/cli.Version=${NEW_TAG#v}" -o dist/jvm_darwin_arm64 ./cmd/jvm
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X github.com/unstoppable-tanmay/jvm/internal/cli.Version=${NEW_TAG#v}" -o dist/jvm_darwin_amd64 ./cmd/jvm

          lipo -create dist/jvm_darwin_arm64 dist/jvm_darwin_amd64 -output dist/dmg_root/bin/jvm
          chmod +x dist/dmg_root/bin/jvm

          cp jvm.sh dist/dmg_root/
          cp jvm.fish dist/dmg_root/
          cp README.md dist/dmg_root/
          cp LICENSE dist/dmg_root/

          # Package into jvm.dmg
          hdiutil create -volname "jvm" -srcfolder dist/dmg_root -ov -format UDZO jvm.dmg
          gh release upload "$NEW_TAG" jvm.dmg#jvm.dmg\ \(macOS\ Universal\ Disk\ Image\) --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows Installer (jvm.exe)
        run: |
          # Compile Windows amd64 binary directly
          mkdir -p dist/windows
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X github.com/unstoppable-tanmay/jvm/internal/cli.Version=${NEW_TAG#v}" -o dist/windows/jvm.exe ./cmd/jvm

          makensis -DVERSION="${NEW_TAG#v}" -DBIN_PATH="dist/windows/jvm.exe" .github/installer/windows/installer.nsi
          gh release upload "$NEW_TAG" jvm.exe#jvm.exe\ \(Windows\ x64\ Setup\ Installer\) --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old releases (keep latest 3)
        run: |
          KEEP=3
          # Get list of releases sorted newest to oldest
          RELEASES=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')
          COUNT=0
          for tag in $RELEASES; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt $KEEP ]; then
              echo "Pruning older release and tag: $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
