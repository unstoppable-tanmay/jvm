name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  goreleaser:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-calculate and push next version tag
        run: |
          # 1. Find the latest semver tag from git
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "Current latest tag: $LATEST_TAG"

          # 2. Parse major, minor, patch
          CLEAN_VER="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VER"

          # Fallbacks if format was not standard
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          # 3. Bump version according to selected input (default: patch)
          BUMP="${{ inputs.bump }}"
          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Next release tag: $NEW_TAG"

          # 4. Create and push tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows Installer (jvm-setup.exe)
        run: |
          sudo apt-get update && sudo apt-get install -y nsis nsis-pluginapi
          # Download EnvVarUpdate header for modifying Windows User PATH
          sudo wget -q -O /usr/share/nsis/Include/EnvVarUpdate.nsh https://raw.githubusercontent.com/Stsound/NSIS-EnvVarUpdate/master/EnvVarUpdate.nsh || true

          # Extract jvm.exe from the goreleaser zip archive in dist
          mkdir -p dist/extracted_win
          WIN_ZIP=$(find dist -name "*windows_amd64.zip" | head -n 1)
          if [ -n "$WIN_ZIP" ]; then
            unzip -o "$WIN_ZIP" -d dist/extracted_win
            WIN_BIN="dist/extracted_win/jvm.exe"
            
            # Compile setup installer with clean universal name jvm-setup.exe
            makensis -DVERSION="${NEW_TAG#v}" -DBIN_PATH="$WIN_BIN" .github/installer/windows/installer.nsi
            gh release upload "$NEW_TAG" jvm-setup.exe --clobber
          else
            echo "Windows archive not found in dist"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old releases (keep latest 3)
        run: |
          KEEP=3
          RELEASES=$(gh release list --limit 100 --json tagName --jq '.[].tagName')
          COUNT=0
          for tag in $RELEASES; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt $KEEP ]; then
              echo "Pruning older release and tag: $tag"
              gh release delete "$tag" --cleanup-tag --yes
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
