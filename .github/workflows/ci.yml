name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run Tests
        run: go test -v ./...

      - name: Validate Cross-Compilation (Linux, macOS, Windows)
        run: |
          echo "Building for Linux (amd64)..."
          GOOS=linux GOARCH=amd64 go build ./cmd/jvm
          echo "Building for macOS (arm64)..."
          GOOS=darwin GOARCH=arm64 go build ./cmd/jvm
          echo "Building for Windows (amd64)..."
          GOOS=windows GOARCH=amd64 go build ./cmd/jvm
